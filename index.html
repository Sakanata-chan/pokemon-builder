<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Team Builder (Gen 1 - 5)</title>
  <style>
    :root {
      --bg-color: #0f111a; --card-bg: #1a1d2d; --card-border: #2a2e45;
      --text-color: #f0f3f9; --text-muted: #8c95a8; --control-bg: #181b2a;
      --control-border: #282c44; --select-bg: #22263d; --dash-bg: #161826;
      --stats-bg: #141724; --tag-bg: #22263d; --primary-yellow: #ffcb05;
      --accent-blue: #3c5aa6; --accent-purple: #9c27b0; --accent-red: #e91e63;
      --accent-teal: #00897b; --accent-gold: #ffb300; --shadow-color: rgba(0, 0, 0, 0.4);
    }

    [data-theme="light"] {
      --bg-color: #f0f2f7; --card-bg: #ffffff; --card-border: #e1e5ee;
      --text-color: #1a1e29; --text-muted: #6b7588; --control-bg: #ffffff;
      --control-border: #e1e5ee; --select-bg: #f4f6fb; --dash-bg: #ffffff;
      --stats-bg: #f0f3f8; --tag-bg: #ebf0f7; --primary-yellow: #dca300;
      --accent-purple: #7b1fa2; --accent-red: #c2185b; --accent-teal: #00695c;
      --shadow-color: rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background-color 0.2s, color 0.2s, border-color 0.2s; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 950px; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
    .theme-btn, .action-btn-sm {
      background-color: var(--control-bg); color: var(--text-color); border: 1px solid var(--control-border);
      padding: 8px 14px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 6px; font-weight: 600; box-shadow: 0 2px 5px var(--shadow-color);
    }
    .theme-btn:hover, .action-btn-sm:hover { border-color: var(--primary-yellow); color: var(--primary-yellow); }
    h1 { color: var(--primary-yellow); text-shadow: 2px 2px #3c5aa6; font-size: 2.5rem; margin-bottom: 8px; }

    .dashboard {
      display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; background-color: var(--dash-bg);
      border: 1px solid var(--control-border); padding: 12px 20px; border-radius: 12px; margin-bottom: 20px; width: 100%; max-width: 950px; box-shadow: 0 4px 12px var(--shadow-color);
    }
    .dash-item { display: flex; flex-direction: column; align-items: center; padding: 0 15px; }
    .dash-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; font-weight: 600; }
    .dash-value { font-size: 1.15rem; font-weight: bold; color: var(--primary-yellow); }

    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; width: 100%; max-width: 950px; margin-bottom: 25px; }
    @media (max-width: 850px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 580px) { .grid { grid-template-columns: repeat(1, minmax(0, 1fr)); } }

    .card {
      background-color: var(--card-bg); border: 2px solid var(--card-border); border-radius: 14px; padding: 16px;
      text-align: center; display: flex; flex-direction: column; align-items: center; box-shadow: 0 4px 12px var(--shadow-color); position: relative; overflow: hidden;
    }
    .card.is-shiny { border: 2px solid #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); background: linear-gradient(135deg, var(--card-bg) 70%, rgba(255, 0, 127, 0.1) 100%); }
    .card.empty-slot { border-style: dashed; justify-content: center; min-height: 420px; }

    /* Unique Styling for Slot 1 (Leader / Active Slot) */
    .card.lead-slot {
      border: 2px solid var(--accent-gold);
      box-shadow: 0 0 18px rgba(255, 179, 0, 0.35);
      background: radial-gradient(circle at top, rgba(255, 203, 5, 0.12) 0%, var(--card-bg) 70%);
    }
    .card.lead-slot.is-shiny {
      border: 2px solid #ff007f;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.5), 0 0 10px rgba(255, 179, 0, 0.3);
    }
    .card.lead-slot.empty-slot { border-style: dashed; border-color: var(--accent-gold); }

    .leader-badge {
      background: linear-gradient(45deg, #ffb300, #ffcb05); color: #000; font-size: 0.7rem; font-weight: 800;
      padding: 2px 8px; border-radius: 6px; letter-spacing: 0.5px; text-transform: uppercase; box-shadow: 0 2px 5px rgba(255, 179, 0, 0.4);
    }

    .shiny-btn-tag {
      background: rgba(255, 0, 127, 0.12); border: 1px solid rgba(255, 0, 127, 0.4); color: #ff007f;
      font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 12px; cursor: pointer;
      display: flex; align-items: center; gap: 3px; transition: all 0.2s;
    }
    .shiny-btn-tag:hover { background: rgba(255, 0, 127, 0.25); border-color: #ff007f; }
    .shiny-btn-tag.active { background: #ff007f; color: #fff; box-shadow: 0 0 8px rgba(255, 0, 127, 0.6); }

    /* Search Box System */
    .search-box { position: relative; width: 100%; margin-bottom: 12px; z-index: 15; }
    .search-input { width: 100%; padding: 10px 12px; font-size: 0.9rem; border-radius: 8px; border: 1px solid var(--control-border); background-color: var(--select-bg); color: var(--text-color); outline: none; font-weight: 600; }
    .search-input:focus { border-color: var(--primary-yellow); }
    .suggestions-list {
      position: absolute; top: 100%; left: 0; right: 0; background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 8px; max-height: 180px; overflow-y: auto; z-index: 100; box-shadow: 0 6px 15px var(--shadow-color); display: none;
    }
    .suggestion-item { padding: 8px 12px; cursor: pointer; font-size: 0.85rem; text-transform: capitalize; text-align: left; }
    .suggestion-item:hover { background-color: var(--select-bg); color: var(--primary-yellow); }

    .card-top-row { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 4px; }

    /* Sprite Container & Scaled Image Rules */
    .sprite-container { height: 180px; width: 100%; display: flex; align-items: center; justify-content: center; margin: 4px 0; z-index: 2; cursor: pointer; overflow: visible; }
    .card img { max-width: 85px; max-height: 85px; width: auto; height: auto; object-fit: contain; image-rendering: pixelated; transform: scale(2); transition: transform 0.2s ease-in-out; }
    .card img:hover { transform: scale(2.25); }

    .sprite-container img.jumping { animation: poke-jump 0.5s cubic-bezier(0.28, 0.84, 0.42, 1); }
    @keyframes poke-jump {
      0%   { transform: scale(2, 2)       translateY(0); }
      10%  { transform: scale(2.2, 1.8)   translateY(0); }
      30%  { transform: scale(1.8, 2.2)   translateY(-14px); }
      50%  { transform: scale(2.1, 1.9)   translateY(-17px); }
      57%  { transform: scale(2, 2)       translateY(-15px); }
      75%  { transform: scale(2, 2)       translateY(0); }
      85%  { transform: scale(2.2, 1.7)   translateY(0); }
      100% { transform: scale(2, 2)       translateY(0); }
    }

    .card-id { color: var(--text-muted); font-size: 0.85rem; font-weight: bold; }
    .card-header { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
    .card-name { font-size: 1.3rem; text-transform: capitalize; font-weight: 700; color: var(--primary-yellow); }
    .level-badge { font-size: 0.85rem; color: #78c850; font-weight: bold; background: rgba(120, 200, 80, 0.15); padding: 2px 6px; border-radius: 6px; }

    .gender-icon { font-size: 1.1rem; font-weight: bold; }
    .gender-male { color: #6890f0; } .gender-female { color: #f85888; } .gender-genderless { color: var(--text-muted); font-size: 0.85rem; }

    .meta-badges-container { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; margin: 10px 0; width: 100%; }
    .pill-badge { 
      font-size: 0.72rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px;
      border: 1px solid var(--control-border); background-color: var(--select-bg); text-transform: capitalize; white-space: nowrap;
    }
    .pill-nature { border-color: rgba(255, 203, 5, 0.3); color: var(--primary-yellow); background: rgba(255, 203, 5, 0.08); } 
    .pill-friend { border-color: rgba(255, 128, 171, 0.3); color: #ff80ab; background: rgba(255, 128, 171, 0.08); }
    .pill-item { border-color: rgba(179, 136, 255, 0.3); color: #b388ff; background: rgba(179, 136, 255, 0.08); }
    .pill-ability { border-color: rgba(0, 229, 255, 0.3); color: #00e5ff; background: rgba(0, 229, 255, 0.08); cursor: help; }

    /* Moveset Grid Displays */
    .moveset-card {
      width: 100%; background-color: var(--stats-bg); border: 1px solid var(--card-border);
      border-radius: 10px; padding: 8px; margin: 6px 0 10px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    }
    .move-slot { 
      background-color: var(--card-bg); border: 1px solid var(--control-border); border-radius: 6px; 
      padding: 6px 8px; font-size: 0.73rem; font-weight: 600; text-transform: capitalize; 
      color: var(--text-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center;
      display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .move-slot.empty { color: var(--text-muted); font-style: italic; border-style: dashed; }

    /* Edit Drawer Controls Overlay */
    .controls-drawer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--card-bg);
      padding: 12px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; z-index: 50;
      transform: translateY(100%); transition: transform 0.25s ease-in-out;
    }
    .card.drawer-open .controls-drawer { transform: translateY(0); }

    .drawer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 6px; margin-bottom: 4px; }
    .drawer-title { font-weight: bold; font-size: 0.9rem; color: var(--primary-yellow); }

    .slot-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; }
    .field-group { display: flex; flex-direction: column; gap: 3px; font-size: 0.72rem; font-weight: 600; color: var(--text-muted); text-align: left; }
    select, input[type="number"] { width: 100%; padding: 5px 7px; font-size: 0.8rem; border-radius: 6px; border: 1px solid var(--control-border); background-color: var(--select-bg); color: var(--text-color); outline: none; }
    select:focus, input[type="number"]:focus { border-color: var(--primary-yellow); }

    /* Detailed Ability Card Layout */
    .ability-edit-card { background: var(--stats-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; margin-top: 3px; }
    .hidden-ability-badge { font-size: 0.65rem; font-weight: bold; background: rgba(156, 39, 176, 0.2); color: #d81b60; border: 1px solid rgba(156, 39, 176, 0.4); padding: 1px 6px; border-radius: 4px; width: fit-content; }
    .ability-desc-text { font-size: 0.68rem; color: var(--text-muted); line-height: 1.25; }

    /* Detailed Moveset Option Card with Stats & Description */
    .drawer-moves-container { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .move-edit-card { background: var(--stats-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
    .move-detail-row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 0.68rem; font-weight: 600; }
    .move-cat-badge { padding: 1px 5px; border-radius: 4px; font-size: 0.65rem; font-weight: bold; color: #fff; text-transform: uppercase; }
    .cat-physical { background-color: #e65100; }
    .cat-special { background-color: #4a148c; }
    .cat-status { background-color: #37474f; }
    .move-stat-badge { background: var(--select-bg); border: 1px solid var(--control-border); padding: 1px 5px; border-radius: 4px; color: var(--text-color); }
    .move-desc-text { font-size: 0.67rem; color: var(--text-muted); line-height: 1.25; margin-top: 2px; }

    .edit-btn {
      background: var(--select-bg); border: 1px solid var(--control-border); color: var(--text-color);
      padding: 7px 12px; border-radius: 8px; font-size: 0.78rem; font-weight: 600; cursor: pointer; margin-bottom: 8px; width: 100%;
    }
    .edit-btn:hover { border-color: var(--primary-yellow); color: var(--primary-yellow); }

    .click-hint { font-size: 0.7rem; color: var(--primary-yellow); margin-bottom: 4px; font-weight: 600; opacity: 0.85; }

    .types { display: flex; gap: 6px; margin-top: auto; padding-top: 4px; }
    .type-badge { padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; text-transform: uppercase; font-weight: bold; color: #fff; }

    /* Type Colors */
    .normal { background-color: #a8a878; } .fire { background-color: #f08030; } .water { background-color: #6890f0; }
    .electric { background-color: #f8d030; color: #000; } .grass { background-color: #78c850; } .ice { background-color: #98d8d8; color: #000; }
    .fighting { background-color: #c03028; } .poison { background-color: #a040a0; } .ground { background-color: #e0c068; color: #000; }
    .flying { background-color: #a890f0; } .psychic { background-color: #f85888; } .bug { background-color: #a8b820; }
    .rock { background-color: #b8a038; } .ghost { background-color: #705898; } .dragon { background-color: #7038f8; }
    .steel { background-color: #b8b8d0; color: #000; } .dark { background-color: #705848; } .fairy { background-color: #ee99ac; color: #000; }

    /* Type Matrix Analysis Section */
    .analysis-section { width: 100%; max-width: 950px; background-color: var(--dash-bg); border: 1px solid var(--control-border); border-radius: 12px; padding: 18px; box-shadow: 0 4px 12px var(--shadow-color); margin-bottom: 30px; }
    .analysis-title { font-size: 1rem; font-weight: bold; color: var(--primary-yellow); margin-bottom: 12px; border-bottom: 1px solid var(--control-border); padding-bottom: 6px; }
    .analysis-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(65px, 1fr)); gap: 8px; text-align: center; }
    .analysis-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 6px; padding: 6px 4px; display: flex; flex-direction: column; gap: 4px; align-items: center; }
    .analysis-count { font-size: 0.8rem; font-weight: bold; }
    .count-weak { color: #ff4d4d; } .count-resist { color: #78c850; } .count-immune { color: #00e5ff; }

    .btn-danger { background: #c2185b; color: white; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }
    .btn-danger:hover { background: #e91e63; }

    /* Modals System */
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; width: 100%; max-width: 900px; max-height: 90vh; padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow: hidden; }
    textarea { width: 100%; height: 220px; background: var(--select-bg); color: var(--text-color); border: 1px solid var(--control-border); border-radius: 8px; padding: 10px; font-family: monospace; }

    /* Pokédex Sheet Modal Styling */
    .dex-filter-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 12px; overflow-y: auto; padding-right: 5px; height: 100%; }
    .dex-card {
      background-color: var(--dash-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 10px;
      display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; transition: all 0.15s ease; position: relative;
    }
    .dex-card:hover { border-color: var(--primary-yellow); transform: translateY(-3px); box-shadow: 0 4px 10px var(--shadow-color); }
    .dex-thumb { width: 68px; height: 68px; object-fit: contain; image-rendering: pixelated; }
    .dex-name { font-size: 0.85rem; font-weight: bold; text-transform: capitalize; margin-top: 4px; color: var(--text-color); }
    .dex-meta-row { display: flex; gap: 6px; align-items: center; margin-bottom: 2px; }
    .dex-number { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
    
    .gen-badge { 
      font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; 
      background: rgba(60, 90, 166, 0.2); color: #76a0ff; border: 1px solid rgba(60, 90, 166, 0.4); 
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="action-btn-sm" id="pokedex-sheet-btn">📖 Pokédex Directory</button>
        <button class="action-btn-sm" id="export-btn">📋 Showdown Export</button>
        <button class="action-btn-sm" id="clear-btn">🗑️ Clear Team</button>
      </div>
      <button class="theme-btn" id="theme-btn"><span id="theme-icon">🌙</span> <span id="theme-text">Dark Mode</span></button>
    </div>
    <h1>Pokémon Team Builder</h1>
    <p>Build your Gen 1-5 team and analyze defensive coverage!</p>
  </header>

  <div class="dashboard">
    <div class="dash-item"><span class="dash-label">Active Team Members</span><span class="dash-value" id="team-counter">0 / 6</span></div>
    <div class="dash-item"><span class="dash-label">Shinies on Team</span><span class="dash-value" id="shiny-counter" style="color: #ff007f;">0</span></div>
    <div class="dash-item"><span class="dash-label">Average Team Level</span><span class="dash-value" id="avg-level-counter">--</span></div>
  </div>

  <!-- 6 Pokémon Slot Grid -->
  <div class="grid" id="pokemon-grid"></div>

  <!-- Defensive Matrix Analysis -->
  <div class="analysis-section">
    <div class="analysis-title">🛡️ Team Type Deficiencies & Weaknesses Matrix</div>
    <div class="analysis-grid" id="type-matrix"></div>
  </div>

  <!-- Showdown Export Modal -->
  <div class="modal" id="export-modal">
    <div class="modal-content" style="max-width: 600px;">
      <h3 style="color: var(--primary-yellow);">Showdown Export</h3>
      <textarea id="export-text" readonly></textarea>
      <button class="action-btn-sm" style="align-self: flex-end;" id="close-modal-btn">Close</button>
    </div>
  </div>

  <!-- Full Pokédex Directory Sheet Modal -->
  <div class="modal" id="dex-modal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="color: var(--primary-yellow);">📖 Full Pokédex Directory (Gen 1 - 5)</h3>
        <button class="action-btn-sm" id="close-dex-btn">Close</button>
      </div>
      
      <div class="dex-filter-bar">
        <input type="text" id="dex-search-input" class="search-input" placeholder="Search by name or #ID..." style="max-width: 220px;">
        
        <select id="dex-gen-filter" style="max-width: 150px;">
          <option value="all">All Generations</option>
          <option value="1">Gen 1 (Kanto)</option>
          <option value="2">Gen 2 (Johto)</option>
          <option value="3">Gen 3 (Hoenn)</option>
          <option value="4">Gen 4 (Sinnoh)</option>
          <option value="5">Gen 5 (Unova)</option>
        </select>

        <span id="dex-results-count" style="font-size:0.8rem; color:var(--text-muted); font-weight:600;">Showing 649 Pokémon</span>
      </div>

      <div class="dex-grid" id="dex-grid-container"></div>
    </div>
  </div>

  <script>
    const NATURE_MODIFIERS = {
      "Adamant": { boost: "attack", nerf: "special-attack" }, "Bold": { boost: "defense", nerf: "attack" },
      "Brave": { boost: "attack", nerf: "speed" }, "Calm": { boost: "special-defense", nerf: "attack" },
      "Careful": { boost: "special-defense", nerf: "special-attack" }, "Gentle": { boost: "special-defense", nerf: "defense" },
      "Hasty": { boost: "speed", nerf: "defense" }, "Impish": { boost: "defense", nerf: "special-attack" },
      "Jolly": { boost: "speed", nerf: "special-attack" }, "Lax": { boost: "defense", nerf: "special-defense" },
      "Lonely": { boost: "attack", nerf: "defense" }, "Mild": { boost: "special-attack", nerf: "defense" },
      "Modest": { boost: "special-attack", nerf: "attack" }, "Naive": { boost: "speed", nerf: "special-defense" },
      "Naughty": { boost: "attack", nerf: "special-defense" }, "Quiet": { boost: "special-attack", nerf: "speed" },
      "Rash": { boost: "special-attack", nerf: "special-defense" }, "Relaxed": { boost: "defense", nerf: "speed" },
      "Sassy": { boost: "special-defense", nerf: "speed" }, "Timid": { boost: "speed", nerf: "attack" }
    };
    const NATURES = ["Bashful", "Docile", "Hardy", "Quirky", "Serious", ...Object.keys(NATURE_MODIFIERS)];
    const HELD_ITEMS = ["Leftovers", "Choice Scarf", "Choice Band", "Choice Specs", "Life Orb", "Focus Sash", "Eviolite", "Rocky Helmet", "Sitrus Berry", "Lum Berry", "Expert Belt", "Air Balloon"];
    const ALL_TYPES = ["normal", "fire", "water", "electric", "grass", "ice", "fighting", "poison", "ground", "flying", "psychic", "bug", "rock", "ghost", "dragon", "steel", "dark"];

    const TYPE_CHART = {
      normal: { rock: 0.5, ghost: 0, steel: 0.5 },
      fire: { fire: 0.5, water: 0.5, grass: 2, ice: 2, bug: 2, rock: 0.5, dragon: 0.5, steel: 2 },
      water: { fire: 2, water: 0.5, grass: 0.5, ground: 2, rock: 2, dragon: 0.5 },
      electric: { water: 2, electric: 0.5, grass: 0.5, ground: 0, flying: 2, dragon: 0.5 },
      grass: { fire: 0.5, water: 2, grass: 0.5, poison: 0.5, ground: 2, flying: 0.5, bug: 0.5, rock: 2, dragon: 0.5, steel: 0.5 },
      ice: { fire: 0.5, water: 0.5, grass: 2, ice: 0.5, ground: 2, flying: 2, dragon: 2, steel: 0.5 },
      fighting: { normal: 2, ice: 2, poison: 0.5, flying: 0.5, psychic: 0.5, bug: 0.5, rock: 2, ghost: 0, dark: 2, steel: 2 },
      poison: { grass: 2, poison: 0.5, ground: 0.5, rock: 0.5, ghost: 0.5, steel: 0 },
      ground: { fire: 2, electric: 2, grass: 0.5, poison: 2, flying: 0, bug: 0.5, rock: 2, steel: 2 },
      flying: { electric: 0.5, grass: 2, fighting: 2, bug: 2, rock: 0.5, steel: 0.5 },
      psychic: { fighting: 2, poison: 2, psychic: 0.5, dark: 0, steel: 0.5 },
      bug: { fire: 0.5, grass: 2, fighting: 0.5, poison: 0.5, flying: 0.5, psychic: 2, ghost: 0.5, dark: 2, steel: 0.5 },
      rock: { fire: 2, ice: 2, fighting: 0.5, ground: 0.5, flying: 2, bug: 2, steel: 0.5 },
      ghost: { normal: 0, psychic: 2, ghost: 2, dark: 0.5 },
      dragon: { dragon: 2, steel: 0.5 },
      steel: { fire: 0.5, water: 0.5, electric: 0.5, ice: 2, rock: 2, steel: 0.5 },
      dark: { fighting: 0.5, psychic: 2, ghost: 2, dark: 0.5 }
    };

    let teamState = Array(6).fill(null).map(() => ({
      pokemon: null, species: null, level: 100, shiny: false, nature: "Hardy",
      gender: "M", friendship: 255, ability: "", item: "", moves: ["", "", "", ""]
    }));

    let speciesIndex = [];
    const moveCache = {}; 
    const abilityCache = {}; // Cache detailed ability data

    function getGenerationById(id) {
      if (id <= 151) return 1;
      if (id <= 251) return 2;
      if (id <= 386) return 3;
      if (id <= 493) return 4;
      return 5;
    }

    async function init() {
      try {
        const response = await fetch('https://pokeapi.co/api/v2/pokemon-species?limit=649');
        const data = await response.json();
        speciesIndex = data.results.map((item, idx) => {
          const id = idx + 1;
          return { id, name: item.name, gen: getGenerationById(id) };
        });
      } catch (e) { console.error("Index load failed", e); }
      renderTeamSlots();
      renderAnalysis();
    }

    function playCry(url) {
      if (!url) return;
      const audio = new Audio(url); audio.volume = 0.5;
      audio.play().catch(e => console.log('Audio playback prevented:', e));
    }

    function getPokemonSprite(pokemon, isShiny, isFemale) {
      const gen5Animated = pokemon.sprites?.versions?.['generation-v']?.['black-white']?.animated;
      const official = pokemon.sprites?.other?.['official-artwork'];

      if (gen5Animated) {
        if (isFemale) {
          if (isShiny && gen5Animated.front_shiny_female) return gen5Animated.front_shiny_female;
          if (!isShiny && gen5Animated.front_female) return gen5Animated.front_female;
        }
        if (isShiny && gen5Animated.front_shiny) return gen5Animated.front_shiny;
        if (!isShiny && gen5Animated.front_default) return gen5Animated.front_default;
      }

      if (isFemale) {
        if (isShiny && pokemon.sprites?.front_shiny_female) return pokemon.sprites.front_shiny_female;
        if (!isShiny && pokemon.sprites?.front_female) return pokemon.sprites.front_female;
      }

      return isShiny ? (pokemon.sprites?.front_shiny || official?.front_shiny) : (pokemon.sprites?.front_default || official?.front_default);
    }

    function getFriendshipStatus(val) {
      if (val === 0) return "Hates you";
      if (val < 50) return "Wary";
      if (val < 100) return "Neutral";
      if (val < 150) return "Friendly";
      if (val < 200) return "Trusts you";
      if (val < 255) return "Loves you";
      return "Unbreakable Bond";
    }

    async function fetchMoveDetails(moveName) {
      if (!moveName) return null;
      if (moveCache[moveName]) return moveCache[moveName];

      try {
        const res = await fetch(`https://pokeapi.co/api/v2/move/${moveName}`);
        const data = await res.json();
        
        const flavor = data.flavor_text_entries.find(f => f.language.name === 'en')?.flavor_text || 
                       data.effect_entries.find(e => e.language.name === 'en')?.short_effect || 'No description available.';

        const details = {
          name: data.name,
          type: data.type.name,
          damageClass: data.damage_class.name,
          power: data.power ?? '—',
          accuracy: data.accuracy ? `${data.accuracy}%` : '100%',
          pp: data.pp ?? '—',
          desc: flavor.replace(/[\r\n\f]/g, ' ')
        };

        moveCache[moveName] = details;
        return details;
      } catch (e) { return null; }
    }

    // Helper to fetch details for an ability
    async function fetchAbilityDetails(abilityName) {
      if (!abilityName) return null;
      if (abilityCache[abilityName]) return abilityCache[abilityName];

      try {
        const res = await fetch(`https://pokeapi.co/api/v2/ability/${abilityName}`);
        const data = await res.json();

        const flavor = data.flavor_text_entries.find(f => f.language.name === 'en')?.flavor_text || 
                       data.effect_entries.find(e => e.language.name === 'en')?.short_effect || 'No description available.';

        const details = {
          name: data.name,
          desc: flavor.replace(/[\r\n\f]/g, ' ')
        };

        abilityCache[abilityName] = details;
        return details;
      } catch (e) { return null; }
    }

    function renderTeamSlots() {
      const grid = document.getElementById('pokemon-grid');
      grid.innerHTML = '';

      teamState.forEach((slot, index) => {
        const card = document.createElement('div');
        const isLead = index === 0;
        
        if (!slot.pokemon) {
          card.className = `card empty-slot ${isLead ? 'lead-slot' : ''}`;
          card.innerHTML = `
            ${isLead ? `<div class="leader-badge" style="position:absolute; top:12px; left:12px;">👑 Leader</div>` : ''}
            <div class="card-id">Slot #${index + 1}</div>
            <div class="search-box">
              <input type="text" class="search-input" placeholder="${isLead ? '+ Choose Lead Pokémon...' : '+ Choose Pokémon...'}" data-index="${index}">
              <div class="suggestions-list" id="suggestions-${index}"></div>
            </div>
          `;
        } else {
          const { pokemon, species } = slot;
          const isShiny = slot.shiny;
          const isFemale = slot.gender === 'F';
          card.className = `card ${isShiny ? 'is-shiny' : ''} ${isLead ? 'lead-slot' : ''}`;

          const spriteUrl = getPokemonSprite(pokemon, isShiny, isFemale);
          const cryUrl = pokemon.cries?.latest || pokemon.cries?.legacy;

          const gRate = species.gender_rate;
          let genderBadge = '';
          if (gRate === -1) {
            genderBadge = `<span class="gender-icon gender-genderless" title="Genderless">∅</span>`;
          } else if (slot.gender === 'F') {
            genderBadge = `<span class="gender-icon gender-female" title="Female">♀</span>`;
          } else {
            genderBadge = `<span class="gender-icon gender-male" title="Male">♂</span>`;
          }

          const friendStatus = getFriendshipStatus(slot.friendship);
          const activeAbilityDetails = abilityCache[slot.ability];

          card.innerHTML = `
            <div class="card-top-row">
              ${isLead ? `<span class="leader-badge">👑 Leader</span>` : `<span class="card-id">#${String(species.id).padStart(4, '0')}</span>`}
              
              <div style="display:flex; gap:6px; align-items:center;">
                <button class="shiny-btn-tag ${isShiny ? 'active' : ''}" onclick="updateSlot(${index}, 'shiny', ${!isShiny})" title="Toggle Shiny Artwork">
                  ✨ Shiny
                </button>
                <button class="btn-danger" onclick="removePokemon(${index})">Remove</button>
              </div>
            </div>
            
            <div class="sprite-container">
              <img src="${spriteUrl}" alt="${pokemon.name}">
            </div>

            <div class="card-header">
              <span class="card-name">${pokemon.name.replace(/-/g, ' ')}</span>
              <span class="level-badge">Lv.${slot.level}</span>
              ${genderBadge}
            </div>

            <div class="meta-badges-container">
              <div class="pill-badge pill-nature">⚡ ${slot.nature}</div>
              <div class="pill-badge pill-friend" title="${friendStatus}">♥ ${slot.friendship}/255</div>
              ${slot.item ? `<div class="pill-badge pill-item">🎒 ${slot.item}</div>` : ''}
              ${slot.ability ? `<div class="pill-badge pill-ability" title="${activeAbilityDetails ? activeAbilityDetails.desc : 'Loading ability info...'}">🌀 ${slot.ability.replace(/-/g, ' ')}</div>` : ''}
            </div>

            <div class="click-hint">👆 Tap sprite to jump & cry</div>

            <div class="moveset-card">
              ${[0, 1, 2, 3].map(mIdx => {
                const moveName = slot.moves[mIdx];
                const moveData = moveCache[moveName];
                let classIcon = '';
                if (moveData) {
                  if (moveData.damageClass === 'physical') classIcon = '💥';
                  else if (moveData.damageClass === 'special') classIcon = '🔮';
                  else classIcon = '🛡️';
                }
                return `
                  <div class="move-slot ${!moveName ? 'empty' : ''}">
                    ${classIcon ? `<span>${classIcon}</span>` : ''}
                    <span>${moveName ? moveName.replace(/-/g, ' ') : '—'}</span>
                  </div>
                `;
              }).join('')}
            </div>

            <button class="edit-btn" onclick="toggleDrawer(${index})">⚙️ Edit Slot</button>

            <div class="types">${pokemon.types.map(t => `<span class="type-badge ${t.type.name}">${t.type.name}</span>`).join('')}</div>

            <!-- Slide-up Edit Drawer -->
            <div class="controls-drawer" id="drawer-${index}">
              <div class="drawer-header">
                <span class="drawer-title">Edit ${pokemon.name.replace(/-/g, ' ')}</span>
                <button class="action-btn-sm" style="padding:4px 10px; font-size:0.75rem;" onclick="toggleDrawer(${index})">Done</button>
              </div>

              <div class="slot-controls">
                <div class="field-group">
                  <label>Level</label>
                  <input type="number" min="1" max="100" value="${slot.level}" onchange="updateSlot(${index}, 'level', parseInt(this.value))">
                </div>
                <div class="field-group">
                  <label>Gender</label>
                  <select onchange="updateSlot(${index}, 'gender', this.value)" ${gRate === -1 ? 'disabled' : ''}>
                    ${gRate === -1 ? `<option value="N">Genderless</option>` : ''}
                    ${gRate !== -1 && gRate !== 8 ? `<option value="M" ${slot.gender === 'M' ? 'selected' : ''}>Male (♂)</option>` : ''}
                    ${gRate !== -1 && gRate !== 0 ? `<option value="F" ${slot.gender === 'F' ? 'selected' : ''}>Female (♀)</option>` : ''}
                  </select>
                </div>
                <div class="field-group">
                  <label>Shiny Mode</label>
                  <select onchange="updateSlot(${index}, 'shiny', this.value === 'true')">
                    <option value="false" ${!isShiny ? 'selected' : ''}>No</option>
                    <option value="true" ${isShiny ? 'selected' : ''}>Yes</option>
                  </select>
                </div>
                <div class="field-group">
                  <label>Nature</label>
                  <select onchange="updateSlot(${index}, 'nature', this.value)">
                    ${NATURES.map(n => `<option value="${n}" ${slot.nature === n ? 'selected' : ''}>${n}</option>`).join('')}
                  </select>
                </div>
                <div class="field-group">
                  <label>Friendship (0-255)</label>
                  <input type="number" min="0" max="255" value="${slot.friendship}" onchange="updateSlot(${index}, 'friendship', Math.min(255, Math.max(0, parseInt(this.value) || 0)))">
                </div>
                <div class="field-group">
                  <label>Held Item</label>
                  <select onchange="updateSlot(${index}, 'item', this.value)">
                    <option value="">None</option>
                    ${HELD_ITEMS.map(i => `<option value="${i}" ${slot.item === i ? 'selected' : ''}>${i}</option>`).join('')}
                  </select>
                </div>
              </div>

              <!-- Ability Selector with Detailed Info Card -->
              <div class="field-group" style="width:100%; margin:4px 0;">
                <label>Ability Selection</label>
                <select onchange="handleAbilitySelect(${index}, this.value)">
                  ${pokemon.abilities.map(a => `<option value="${a.ability.name}" ${slot.ability === a.ability.name ? 'selected' : ''}>${a.ability.name.replace(/-/g, ' ')} ${a.is_hidden ? '(Hidden)' : ''}</option>`).join('')}
                </select>
                ${slot.ability ? `
                  <div class="ability-edit-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                      <span style="font-size:0.75rem; font-weight:bold; color:var(--primary-yellow); text-transform:capitalize;">🌀 ${slot.ability.replace(/-/g, ' ')}</span>
                      ${pokemon.abilities.find(a => a.ability.name === slot.ability)?.is_hidden ? `<span class="hidden-ability-badge">✨ Hidden Ability</span>` : ''}
                    </div>
                    <div class="ability-desc-text">${activeAbilityDetails ? activeAbilityDetails.desc : 'Loading ability description...'}</div>
                  </div>
                ` : ''}
              </div>

              <div class="field-group" style="width:100%;">
                <label>Moveset Configuration</label>
                <div class="drawer-moves-container">
                  ${[0, 1, 2, 3].map(mIdx => {
                    const currentMove = slot.moves[mIdx];
                    const details = moveCache[currentMove];

                    let catClass = 'cat-status';
                    let catLabel = '🛡️ Status';
                    if (details?.damageClass === 'physical') { catClass = 'cat-physical'; catLabel = '💥 Physical'; }
                    else if (details?.damageClass === 'special') { catClass = 'cat-special'; catLabel = '🔮 Special'; }

                    return `
                      <div class="move-edit-card">
                        <select onchange="handleMoveSelect(${index}, ${mIdx}, this.value)">
                          <option value="">- Select Move ${mIdx + 1} -</option>
                          ${pokemon.moves.map(m => `<option value="${m.move.name}" ${currentMove === m.move.name ? 'selected' : ''}>${m.move.name.replace(/-/g, ' ')}</option>`).join('')}
                        </select>
                        ${details ? `
                          <div class="move-detail-row">
                            <span class="type-badge ${details.type}">${details.type}</span>
                            <span class="move-cat-badge ${catClass}">${catLabel}</span>
                            <span class="move-stat-badge">PWR: ${details.power}</span>
                            <span class="move-stat-badge">ACC: ${details.accuracy}</span>
                            <span class="move-stat-badge">PP: ${details.pp}</span>
                          </div>
                          <div class="move-desc-text">${details.desc}</div>
                        ` : ''}
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>
          `;

          const spriteImg = card.querySelector('.sprite-container img');
          const spriteContainer = card.querySelector('.sprite-container');

          spriteContainer.addEventListener('click', (e) => {
            e.stopPropagation();
            playCry(cryUrl);
            spriteImg.classList.remove('jumping');
            void spriteImg.offsetWidth;
            spriteImg.classList.add('jumping');
          });
        }

        grid.appendChild(card);
      });

      attachSearchListeners();
      updateDashboard();
    }

    function toggleDrawer(index) {
      const card = document.querySelectorAll('.grid .card')[index];
      if (card) card.classList.toggle('drawer-open');
    }

    function attachSearchListeners() {
      document.querySelectorAll('.search-input').forEach(input => {
        if(input.id === 'dex-search-input') return;
        input.addEventListener('input', (e) => {
          const index = e.target.dataset.index;
          const query = e.target.value.toLowerCase().trim();
          const list = document.getElementById(`suggestions-${index}`);

          if (!query) { list.style.display = 'none'; return; }
          const matches = speciesIndex.filter(s => s.name.includes(query)).slice(0, 8);
          if (matches.length === 0) { list.style.display = 'none'; return; }

          list.innerHTML = matches.map(m => `<div class="suggestion-item" onclick="selectPokemon(${index}, '${m.name}')">${m.name.replace(/-/g, ' ')}</div>`).join('');
          list.style.display = 'block';
        });
      });
    }

    async function selectPokemon(index, name) {
      try {
        const [pokemon, species] = await Promise.all([
          fetch(`https://pokeapi.co/api/v2/pokemon/${name}`).then(r => r.json()),
          fetch(`https://pokeapi.co/api/v2/pokemon-species/${name}`).then(r => r.json())
        ]);

        let defaultGender = 'M';
        if (species.gender_rate === -1) defaultGender = 'N';
        else if (species.gender_rate === 8) defaultGender = 'F';

        const defaultAbility = pokemon.abilities[0]?.ability.name || "";

        teamState[index] = {
          pokemon, species, level: 100, shiny: false, nature: "Hardy",
          gender: defaultGender, friendship: species.base_happiness ?? 70, 
          ability: defaultAbility, item: "", moves: ["", "", "", ""]
        };

        if (defaultAbility) {
          await fetchAbilityDetails(defaultAbility);
        }

        renderTeamSlots();
        renderAnalysis();
      } catch (e) { console.error("Error setting Pokémon:", e); }
    }

    function removePokemon(index) {
      teamState[index] = { pokemon: null, species: null, level: 100, shiny: false, nature: "Hardy", gender: "M", friendship: 255, ability: "", item: "", moves: ["", "", "", ""] };
      renderTeamSlots();
      renderAnalysis();
    }

    function updateSlot(index, field, value) {
      teamState[index][field] = value;
      renderTeamSlots();
      renderAnalysis();
    }

    async function handleAbilitySelect(slotIdx, abilityName) {
      teamState[slotIdx].ability = abilityName;
      if (abilityName && !abilityCache[abilityName]) {
        await fetchAbilityDetails(abilityName);
      }
      renderTeamSlots();
    }

    async function handleMoveSelect(slotIdx, moveIdx, moveName) {
      teamState[slotIdx].moves[moveIdx] = moveName;
      if (moveName && !moveCache[moveName]) {
        await fetchMoveDetails(moveName);
      }
      renderTeamSlots();
    }

    function updateDashboard() {
      const activeMembers = teamState.filter(s => s.pokemon !== null);
      document.getElementById('team-counter').textContent = `${activeMembers.length} / 6`;
      document.getElementById('shiny-counter').textContent = activeMembers.filter(s => s.shiny).length;
      
      if (activeMembers.length > 0) {
        const avg = Math.round(activeMembers.reduce((acc, curr) => acc + curr.level, 0) / activeMembers.length);
        document.getElementById('avg-level-counter').textContent = `Lv. ${avg}`;
      } else {
        document.getElementById('avg-level-counter').textContent = `--`;
      }
    }

    function renderAnalysis() {
      const container = document.getElementById('type-matrix');
      container.innerHTML = '';

      ALL_TYPES.forEach(type => {
        let weaknesses = 0, resistances = 0, immunities = 0;

        teamState.forEach(slot => {
          if (!slot.pokemon) return;
          let multiplier = 1.0;
          slot.pokemon.types.forEach(t => {
            const defType = t.type.name;
            if (TYPE_CHART[type] && TYPE_CHART[type][defType] !== undefined) {
              multiplier *= TYPE_CHART[type][defType];
            }
          });

          if (multiplier > 1.0) weaknesses++;
          else if (multiplier === 0) immunities++;
          else if (multiplier < 1.0) resistances++;
        });

        const card = document.createElement('div');
        card.className = 'analysis-card';
        card.innerHTML = `
          <span class="type-badge ${type}">${type.slice(0, 3)}</span>
          <span class="analysis-count count-weak" title="Weakness">-${weaknesses}</span>
          <span class="analysis-count count-resist" title="Resistance">+${resistances}</span>
          ${immunities > 0 ? `<span class="analysis-count count-immune" title="Immunity">x${immunities}</span>` : ''}
        `;
        container.appendChild(card);
      });
    }

    /* Pokédex Directory Sheet Functions */
    function renderPokedexGrid() {
      const container = document.getElementById('dex-grid-container');
      const query = document.getElementById('dex-search-input').value.toLowerCase().trim();
      const genFilter = document.getElementById('dex-gen-filter').value;
      
      container.innerHTML = '';

      const filtered = speciesIndex.filter(item => {
        const matchesQuery = item.name.includes(query) || String(item.id).includes(query);
        const matchesGen = genFilter === 'all' || item.gen === parseInt(genFilter);
        return matchesQuery && matchesGen;
      });

      document.getElementById('dex-results-count').textContent = `Showing ${filtered.length} Pokémon`;

      filtered.forEach(item => {
        const thumbUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${item.id}.png`;
        
        const card = document.createElement('div');
        card.className = 'dex-card';
        card.innerHTML = `
          <div class="dex-meta-row">
            <span class="dex-number">#${String(item.id).padStart(3, '0')}</span>
            <span class="gen-badge">Gen ${item.gen}</span>
          </div>
          <img class="dex-thumb" src="${thumbUrl}" alt="${item.name}" loading="lazy">
          <span class="dex-name">${item.name.replace(/-/g, ' ')}</span>
        `;

        card.addEventListener('click', () => {
          promptSlotSelection(item.name);
        });

        container.appendChild(card);
      });
    }

    function promptSlotSelection(name) {
      const emptyIdx = teamState.findIndex(s => s.pokemon === null);
      const targetSlot = emptyIdx !== -1 ? emptyIdx : 0;
      
      const choice = prompt(`Add ${name.toUpperCase()} to team:\nEnter Slot number (1-6):`, targetSlot + 1);
      if (choice) {
        const slotNum = parseInt(choice);
        if (slotNum >= 1 && slotNum <= 6) {
          selectPokemon(slotNum - 1, name);
          document.getElementById('dex-modal').style.display = 'none';
        } else {
          alert('Invalid slot number. Please choose 1 - 6.');
        }
      }
    }

    document.getElementById('pokedex-sheet-btn').addEventListener('click', () => {
      renderPokedexGrid();
      document.getElementById('dex-modal').style.display = 'flex';
    });

    document.getElementById('close-dex-btn').addEventListener('click', () => {
      document.getElementById('dex-modal').style.display = 'none';
    });

    document.getElementById('dex-search-input').addEventListener('input', renderPokedexGrid);
    document.getElementById('dex-gen-filter').addEventListener('change', renderPokedexGrid);

    document.getElementById('export-btn').addEventListener('click', () => {
      let exportText = "";
      teamState.forEach(slot => {
        if (!slot.pokemon) return;
        let genderStr = slot.gender === 'F' ? ' (F)' : slot.gender === 'M' ? ' (M)' : '';
        exportText += `${slot.pokemon.name}${genderStr} ${slot.item ? `@ ${slot.item}` : ''}\n`;
        exportText += `Ability: ${slot.ability}\nLevel: ${slot.level}\n`;
        if (slot.shiny) exportText += `Shiny: Yes\n`;
        if (slot.friendship !== 255) exportText += `Happiness: ${slot.friendship}\n`;
        exportText += `${slot.nature} Nature\n`;
        slot.moves.forEach(m => { if (m) exportText += `- ${m}\n`; });
        exportText += `\n`;
      });

      document.getElementById('export-text').value = exportText || "No Pokémon added to team yet!";
      document.getElementById('export-modal').style.display = 'flex';
    });

    document.getElementById('close-modal-btn').addEventListener('click', () => {
      document.getElementById('export-modal').style.display = 'none';
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
      teamState = Array(6).fill(null).map(() => ({
        pokemon: null, species: null, level: 100, shiny: false, nature: "Hardy", gender: "M", friendship: 255, ability: "", item: "", moves: ["", "", "", ""]
      }));
      renderTeamSlots();
      renderAnalysis();
    });

    document.getElementById('theme-btn').addEventListener('click', () => {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      if (isLight) {
        document.documentElement.removeAttribute('data-theme');
        document.getElementById('theme-icon').textContent = '🌙';
        document.getElementById('theme-text').textContent = 'Dark Mode';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        document.getElementById('theme-icon').textContent = '☀️';
        document.getElementById('theme-text').textContent = 'Light Mode';
      }
    });

    init();
  </script>
</body>
</html>
